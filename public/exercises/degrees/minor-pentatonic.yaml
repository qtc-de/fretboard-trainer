fretboardtrainer:
  name: "Degrees — A minor pentatonic"
  description: "See each of the five A minor pentatonic shapes and find its roots, 5ths, ♭3s, ♭7s and 4ths — shape by shape, then mixed, then in random keys."
  ordered: true
  exercises:
    - name: "Shape 1: roots"
      description: "Tap every root (A) in the 1st A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 1
      degrees: [1]
    - name: "Shape 2: roots"
      description: "Tap every root (A) in the 2nd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 2
      degrees: [1]
    - name: "Shape 3: roots"
      description: "Tap every root (A) in the 3rd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 3
      degrees: [1]
    - name: "Shape 4: roots"
      description: "Tap every root (A) in the 4th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 4
      degrees: [1]
    - name: "Shape 5: roots"
      description: "Tap every root (A) in the 5th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 5
      degrees: [1]
    - name: "Shape 1: 5ths"
      description: "Tap every 5th (E) in the 1st A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 1
      degrees: [5]
    - name: "Shape 2: 5ths"
      description: "Tap every 5th (E) in the 2nd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 2
      degrees: [5]
    - name: "Shape 3: 5ths"
      description: "Tap every 5th (E) in the 3rd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 3
      degrees: [5]
    - name: "Shape 4: 5ths"
      description: "Tap every 5th (E) in the 4th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 4
      degrees: [5]
    - name: "Shape 5: 5ths"
      description: "Tap every 5th (E) in the 5th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 5
      degrees: [5]
    - name: "Shape 1: ♭3s"
      description: "Tap every ♭3 (minor 3rd) (C) in the 1st A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 1
      degrees: [b3]
    - name: "Shape 2: ♭3s"
      description: "Tap every ♭3 (minor 3rd) (C) in the 2nd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 2
      degrees: [b3]
    - name: "Shape 3: ♭3s"
      description: "Tap every ♭3 (minor 3rd) (C) in the 3rd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 3
      degrees: [b3]
    - name: "Shape 4: ♭3s"
      description: "Tap every ♭3 (minor 3rd) (C) in the 4th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 4
      degrees: [b3]
    - name: "Shape 5: ♭3s"
      description: "Tap every ♭3 (minor 3rd) (C) in the 5th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 5
      degrees: [b3]
    - name: "Shape 1: ♭7s"
      description: "Tap every ♭7 (G) in the 1st A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 1
      degrees: [b7]
    - name: "Shape 2: ♭7s"
      description: "Tap every ♭7 (G) in the 2nd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 2
      degrees: [b7]
    - name: "Shape 3: ♭7s"
      description: "Tap every ♭7 (G) in the 3rd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 3
      degrees: [b7]
    - name: "Shape 4: ♭7s"
      description: "Tap every ♭7 (G) in the 4th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 4
      degrees: [b7]
    - name: "Shape 5: ♭7s"
      description: "Tap every ♭7 (G) in the 5th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 5
      degrees: [b7]
    - name: "Shape 1: 4ths"
      description: "Tap every 4th (D) in the 1st A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 1
      degrees: [4]
    - name: "Shape 2: 4ths"
      description: "Tap every 4th (D) in the 2nd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 2
      degrees: [4]
    - name: "Shape 3: 4ths"
      description: "Tap every 4th (D) in the 3rd A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 3
      degrees: [4]
    - name: "Shape 4: 4ths"
      description: "Tap every 4th (D) in the 4th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 4
      degrees: [4]
    - name: "Shape 5: 4ths"
      description: "Tap every 4th (D) in the 5th A minor pentatonic shape."
      root: A
      scale: minor-pentatonic
      shape: 5
      degrees: [4]
    - name: "Roots and 5ths — shape {{shape}}"
      description: "Tap every root and 5th (A, E) in the {{shape_ordinal}} shape."
      root: A
      scale: minor-pentatonic
      shape: random
      degrees: [1, 5]
      repeat: 3
    - name: "Minor triad — shape {{shape}}"
      description: "Tap the minor triad: every root, ♭3 and 5th (A, C, E) in the {{shape_ordinal}} shape."
      root: A
      scale: minor-pentatonic
      shape: random
      degrees: [1, b3, 5]
      repeat: 3
    - name: "Minor 7th chord — shape {{shape}}"
      description: "Tap the m7 chord tones: root, ♭3, 5th and ♭7 (A, C, E, G) in the {{shape_ordinal}} shape."
      root: A
      scale: minor-pentatonic
      shape: random
      degrees: [1, b3, 5, b7]
      repeat: 3
    - name: "Find the {{degree}}s — shape {{shape}}"
      description: "Random shape and degree in A minor pentatonic. A wrong tap shows which degree you hit."
      root: A
      scale: minor-pentatonic
      shape: random
      degrees: random
      repeat: 8
    - name: "Roots — {{root}} minor pentatonic, shape {{shape}}"
      description: "Random key: tap every root of the shape."
      root: random
      scale: minor-pentatonic
      shape: random
      degrees: [1]
      repeat: 4
    - name: "Roots and 5ths — {{root}} minor pentatonic, shape {{shape}}"
      description: "Random key: tap every root and 5th."
      root: random
      scale: minor-pentatonic
      shape: random
      degrees: [1, 5]
      repeat: 3
    - name: "Find the {{degree}}s — {{root}} minor pentatonic, shape {{shape}}"
      description: "Random key, shape and degree."
      root: random
      scale: minor-pentatonic
      shape: random
      degrees: random
      repeat: 8
