      description: "Tap every root and 5th (D, A) in the {{shape_ordinal}} shape."
      root: D
      scale: dorian
      shape: random
      degrees: [1, 5]
      repeat: 3
    - name: "Minor 7th chord — shape {{shape}}"
      description: "Tap the m7 chord tones: root, ♭3, 5th and ♭7 (D, F, A, C) in the {{shape_ordinal}} shape."
