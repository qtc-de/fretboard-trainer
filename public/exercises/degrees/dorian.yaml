      description: "Tap every root, ♭3 and the dorian 6th (D, F, B) in the {{shape_ordinal}} shape."
      root: D
      scale: dorian
      shape: random
      degrees: [1, b3, 6]
      repeat: 3
    - name: "Find the {{degree}}s — shape {{shape}}"
      description: "Random shape and degree in D dorian. A wrong tap shows which degree you hit."
      root: D
      scale: dorian
