      description: "The ♭7 (F) gives mixolydian its sound. Tap every one in the {{shape_ordinal}} shape."
      root: G
      scale: mixolydian
      shape: random
      degrees: [b7]
      repeat: 3
    - name: "Roots and 5ths — shape {{shape}}"
      description: "Tap every root and 5th (G, D) in the {{shape_ordinal}} shape."
      root: G
      scale: mixolydian
      shape: random
      degrees: [1, 5]
      repeat: 3
    - name: "Dominant 7th chord — shape {{shape}}"
      description: "Tap the dominant 7 chord tones: root, 3rd, 5th and ♭7 (G, B, D, F) in the {{shape_ordinal}} shape."
      root: G
      scale: mixolydian
      shape: random
      degrees: [1, 3, 5, b7]
      repeat: 3
    - name: "The tritone: 3rd and ♭7 — shape {{shape}}"
      description: "Tap every 3rd and ♭7, the two notes that define a dominant chord (B, F) in the {{shape_ordinal}} shape."
      root: G
      scale: mixolydian
      shape: random
      degrees: [3, b7]
      repeat: 3
    - name: "Find the {{degree}}s — shape {{shape}}"
      description: "Random shape and degree in G mixolydian. A wrong tap shows which degree you hit."
      root: G
      scale: mixolydian
      shape: random
      degrees: random
      repeat: 8
    - name: "Roots — {{root}} mixolydian, shape {{shape}}"
