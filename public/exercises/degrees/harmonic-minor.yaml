      description: "The 7th (major 7th) (G#) gives harmonic minor its sound. Tap every one in the {{shape_ordinal}} shape."
      root: A
      scale: harmonic-minor
      shape: random
      degrees: [7]
      repeat: 3
    - name: "Roots and 5ths — shape {{shape}}"
      description: "Tap every root and 5th (A, E) in the {{shape_ordinal}} shape."
      root: A
      scale: harmonic-minor
      shape: random
      degrees: [1, 5]
      repeat: 3
    - name: "Minor triad — shape {{shape}}"
      description: "Tap the minor triad: every root, ♭3 and 5th (A, C, E) in the {{shape_ordinal}} shape."
      root: A
      scale: harmonic-minor
      shape: random
      degrees: [1, b3, 5]
      repeat: 3
    - name: "♭6 and 7 — shape {{shape}}"
      description: "Tap every ♭6 and major 7th, the augmented 2nd step that gives harmonic minor its sound (F, G#) in the {{shape_ordinal}} shape."
      root: A
      scale: harmonic-minor
      shape: random
      degrees: [b6, 7]
      repeat: 3
    - name: "Find the {{degree}}s — shape {{shape}}"
      description: "Random shape and degree in A harmonic minor. A wrong tap shows which degree you hit."
      root: A
      scale: harmonic-minor
      shape: random
      degrees: random
      repeat: 8
    - name: "Roots — {{root}} harmonic minor, shape {{shape}}"
      description: "Random key: tap every root of the shape."
      root: random
      scale: harmonic-minor
      shape: random
      degrees: [1]
      repeat: 4
