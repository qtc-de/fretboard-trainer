      scale: major
      shape: random
      degrees: [1, 3, 5, 7]
      repeat: 3
    - name: "Find the {{degree}}s — shape {{shape}}"
      description: "Random shape and degree in G major. A wrong tap shows which degree you hit."
      root: G
      scale: major
      shape: random
      degrees: random
      repeat: 8
