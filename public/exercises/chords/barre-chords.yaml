fretboardtrainer:
  name: Barre Chord Shapes
  description: The two movable shapes, root on the 6th and 5th string. Tap every note under your fingers.
  ordered: false
  instrument: guitar
  exercises:
    - name: F major (E shape, fret 1)
      positions: ["6:1", "5:3", "4:3", "3:2", "2:1", "1:1"]
    - name: G minor (Em shape, fret 3)
      positions: ["6:3", "5:5", "4:5", "3:3", "2:3", "1:3"]
    - name: B♭ major (A shape, fret 1)
      positions: ["5:1", "4:3", "3:3", "2:3", "1:1"]
    - name: C minor (Am shape, fret 3)
      positions: ["5:3", "4:5", "3:5", "2:4", "1:3"]
